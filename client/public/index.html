<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimeWL</title>
    <meta
      name="description"
      content="AnimeWL es una plataforma para descubrir animes, consultar detalles, guardar favoritos y seguir tu progreso de visualización."
    />
    <meta
      name="keywords"
      content="anime, animes, lista anime, favoritos anime, seguimiento anime, directorio anime, AnimeWL"
    />
    <meta name="author" content="AnimeWL" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#209F36" />
    <link rel="canonical" href="https://animewl.cat/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnimeWL" />
    <meta property="og:title" content="AnimeWL | Descubre, guarda y sigue tus animes favoritos" />
    <meta
      property="og:description"
      content="Explora un directorio de anime, consulta detalles de tus series favoritas y organiza tu seguimiento en AnimeWL."
    />
    <meta property="og:url" content="https://animewl.cat/" />
    <meta property="og:image" content="https://animewl.cat/assets/LogoAnimeWLCuadrado-B9zf_K9j.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AnimeWL | Descubre, guarda y sigue tus animes favoritos" />
    <meta
      name="twitter:description"
      content="Explora animes, guarda favoritos y sigue tu progreso desde una sola plataforma."
    />
    <meta name="twitter:image" content="https://animewl.cat/assets/LogoAnimeWLCuadrado-B9zf_K9j.webp" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AnimeWL",
        "url": "https://animewl.cat/",
        "description": "Plataforma para descubrir animes, guardar favoritos y seguir el progreso de visualización.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://animewl.cat/directory?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
